auth:
  hash:
    cost: 32
  token:
    duration: 86400 # in seconds
    rs512_key_pair_bit_size: 2048
database:
  type: "mysql"
  host: "0.0.0.0"
  port: 3306
  username: "root"
  password: "secret"
  database: "idm"
log:
  level: "debug" # [debug, info, warn, error, panic]
cache:
  type: "redis" # [redis, in-memory]
  addr: "0.0.0.0:6379"
  username: ""
  password: ""
  db: 0
grpc:
  address: "0.0.0.0:8080"
  get_download_task_file:
    response_buffer_size: 2kb
http:
  address: "0.0.0.0:8081"
  mode: "production" # [development, production]
mq:
  addresses: ["0.0.0.0:9092"]
  client_id: "1"
cron:
  execute_all_pending_download_task:
    schedule: "@every 1m"
    concurrency_limit: 8
  update_failed_download_task_status_to_pending:
    schedule: "@every 10m"
download:
  mode: "s3"
  download_directory: "./downloads/"
  bucket: "idm"
  address: "0.0.0.0:9000"
  username: "root"
  password: "secret123"
  engine:
    # Mirrors IDM's constants, tuned for general use.
    max_connections: 16 # user ceiling; absolute cap is hard_cap
    hard_cap: 32 # IDM FUN_005bad00: 0x20
    min_chunk_size: 10240 # IDM: 0x2800, one connection per 10 KiB
    min_work_unit: 262144 # smallest piece a runtime split creates
    idle_timeout: "30s" # IDM: 0x1e seconds stall watchdog
    max_retries: 5
    buffer_size: 131072
    enable_resume: true
    state_directory: "" # default: ./downloads/.checkpoints
    user_agent: "idm-segmented/1.0"
    dial_timeout: "15s"
    max_bytes_per_second: 0 # aggregate rate cap; 0 = unlimited
    no_overwrite: true # pick a unique name instead of replacing files
    disable_preallocate: false # preallocate the full size before transfer
    # Request customisation for gated downloads (CDN Referer, cookies, auth):
    referer: "" # e.g. "https://example.com/page"
    headers: {} # e.g. {"X-Api-Key": "..."} (Range/Content-Length are rejected)
    cookies: [] # e.g. ["session=abc123"]
    username: "" # HTTP Basic Auth
    password: ""
